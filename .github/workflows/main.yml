name: Python CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pytest pytest-cov

      - name: Run pylint
        run: pylint --init-hook='import sys; sys.path.insert(0, ".")' file_merger.py run_merge.py tests/test_file_merger.py

      - name: Run tests with coverage
        run: pytest -v --cov=file_merger --cov-report=term-missing